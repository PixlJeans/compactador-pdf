name: Compilar Compactador PDF

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nombre: Windows
          - os: macos-13
            nombre: Mac-Intel
          - os: macos-14
            nombre: Mac-AppleSilicon
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Compilar ejecutable para Windows
        if: runner.os == 'Windows'
        run: pyinstaller --noconfirm --windowed --name CompactadorPDF app.py

      - name: Crear instalador de Windows (Setup.exe)
        if: runner.os == 'Windows'
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Compilar app para Mac
        if: runner.os == 'macOS'
        run: pyinstaller --noconfirm --windowed --name CompactadorPDF app.py

      - name: Crear instalador de Mac (.dmg)
        if: runner.os == 'macOS'
        run: |
          brew install create-dmg
          mkdir -p dist
          create-dmg \
            --volname "Compactador PDF" \
            --window-size 540 380 \
            --icon-size 110 \
            --icon "dist/CompactadorPDF.app" 140 170 \
            --app-drop-link 400 170 \
            "dist/CompactadorPDF-${{ matrix.nombre }}.dmg" \
            "dist/CompactadorPDF.app" || true

      - name: Subir archivos de Windows
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: CompactadorPDF-Windows
          path: |
            instaladores/*.exe
            dist/CompactadorPDF/CompactadorPDF.exe
          if-no-files-found: warn

      - name: Subir archivo de Mac
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: CompactadorPDF-${{ matrix.nombre }}
          path: dist/*.dmg
          if-no-files-found: warn

      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            instaladores/*.exe
            dist/*.dmg

  guardar-instaladores:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: descargas

      - name: Copiar instaladores a la carpeta instaladores
        run: |
          mkdir -p instaladores
          find descargas -type f \( -name "*.exe" -o -name "*.dmg" \) -exec cp {} instaladores/ \;
          ls -la instaladores

      - name: Guardar instaladores en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instaladores
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "Actualizar instaladores [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
