name: Compilar Compactador PDF

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Compilar para Windows
        if: runner.os == 'Windows'
        run: pyinstaller --windowed --onefile --name "Compactador PDF" app.py

      - name: Compilar para Mac
        if: runner.os == 'macOS'
        run: |
          pyinstaller --windowed --name "Compactador PDF" app.py
          ditto -c -k --sequesterRsrc --keepParent "dist/Compactador PDF.app" "dist/CompactadorPDF-mac.zip"

      - name: Subir ejecutable de Windows
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: CompactadorPDF-Windows
          path: dist/Compactador PDF.exe

      - name: Subir app de Mac
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: CompactadorPDF-Mac
          path: dist/CompactadorPDF-mac.zip

      - name: Publicar Windows en Releases
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Compactador PDF.exe

      - name: Publicar Mac en Releases
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CompactadorPDF-mac.zip
