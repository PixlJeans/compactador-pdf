name: Compilar Compactador PDF

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            chip: windows
          - os: macos-14
            chip: apple
          - os: macos-13
            chip: intel
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Compilar ejecutable para Windows
        if: runner.os == 'Windows'
        run: pyinstaller --windowed --onefile --name "Compactador PDF" app.py

      - name: Crear instalador de Windows (Setup.exe)
        if: runner.os == 'Windows'
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Compilar app para Mac
        if: runner.os == 'macOS'
        run: pyinstaller --windowed --name "Compactador PDF" app.py

      - name: Crear instalador de Mac (.dmg)
        if: runner.os == 'macOS'
        run: |
          brew install create-dmg
          create-dmg \
            --volname "Compactador PDF" \
            --window-size 540 380 \
            --icon-size 110 \
            --icon "Compactador PDF.app" 140 170 \
            --app-drop-link 400 170 \
            "dist/CompactadorPDF-Mac-${{ matrix.chip }}.dmg" \
            "dist/Compactador PDF.app"

      - name: Subir archivos de Windows
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: CompactadorPDF-Windows
          path: |
            dist/CompactadorPDF-Setup.exe
            dist/Compactador PDF.exe

      - name: Subir archivo de Mac
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: CompactadorPDF-Mac-${{ matrix.chip }}
          path: dist/CompactadorPDF-Mac-${{ matrix.chip }}.dmg

      - name: Publicar Windows en Releases
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CompactadorPDF-Setup.exe
            dist/Compactador PDF.exe

      - name: Publicar Mac en Releases
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CompactadorPDF-Mac-${{ matrix.chip }}.dmg

  guardar-instaladores:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: descargas

      - name: Copiar instaladores a la carpeta instaladores
        run: |
          rm -rf instaladores
          mkdir -p instaladores
          find descargas -type f \( -name "*.exe" -o -name "*.dmg" \) -exec cp {} instaladores/ \;
          ls -la instaladores

      - name: Guardar instaladores en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A instaladores
          git commit -m "Actualizar instaladores [skip ci]" || echo "Sin cambios"
          git pull --rebase origin main
          git push origin HEAD:main
